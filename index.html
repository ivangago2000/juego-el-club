    const todosLosJugadores = Object.keys(preguntas);
    const seleccionados = [];

    function crearCheckboxes() {
      const container = document.getElementById("jugadoresCheckboxes");
      todosLosJugadores.forEach(nombre => {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = nombre;
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(nombre));
        container.appendChild(label);
      });
    }

    function guardarJugadores() {
      const checkboxes = document.querySelectorAll(".checkboxes input:checked");
      seleccionados.length = 0;
      checkboxes.forEach(cb => seleccionados.push(cb.value));
      if (seleccionados.length > 0) {
        document.getElementById("btnGirar").style.display = "block";
      } else {
        alert("Selecciona al menos un jugador para empezar");
      }
    }

    function girarRuleta() {
      if (seleccionados.length === 0) return;
      const nombre = seleccionados[Math.floor(Math.random() * seleccionados.length)];
      const preguntaLista = preguntas[nombre];
      const pregunta = preguntaLista[Math.floor(Math.random() * preguntaLista.length)];

      document.getElementById("resultado").innerHTML = `🎯 <b>${nombre}</b>: ${pregunta}`;
    }

    crearCheckboxes();
  </script>
